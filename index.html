<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="media/linkedin.png">
 
    <style>
        * { font-family: 'Outfit', sans-serif; }
 
        body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: black;
            background-size: cover;
            background-position: center;
        }

        video { position: fixed; top: -1px; left: -1px; width: 105%; height: 105%; object-fit: cover; }
 
        .glass3d {
            --filter-glass3d: blur(26px) brightness(0.84) saturate(2);
            --color-glass3d: hsl(189 80% 22% / 0);
            position: relative;
            z-index: 4;
            box-shadow:
                0 0 0.75px hsl(205 20% 10% / 0.2),
                0.7px 0.8px 1.2px -0.4px hsl(205 20% 10% / 0.1),
                1.3px 1.5px 2.2px -0.8px hsl(205 20% 10% / 0.1),
                2.3px 2.6px 3.9px -1.2px hsl(205 20% 10% / 0.1),
                3.9px 4.4px 6.6px -1.7px hsl(205 20% 10% / 0.1),
                6.5px 7.2px 10.9px -2.1px hsl(205 20% 10% / 0.1),
                8px 9px 14px -2.5px hsl(205 20% 10% / 0.2);
        }
        .glass3d::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 3;
            -webkit-backdrop-filter: var(--filter-glass3d);
            backdrop-filter: var(--filter-glass3d);
            background-color: var(--color-glass3d);
            background-size: 100%, 100px;
            background-repeat: no-repeat, repeat;
        }
        .glass3d::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 5;
            box-shadow:
                inset 2px 2px 1px -3px hsla(175, 22%, 90%, 0.8),
                inset 4px 4px 2px -6px hsl(205 20% 90% / 0.3),
                inset 1.5px 1.5px 1.5px -0.75px hsl(205 20% 90% / 0.15),
                inset 1.5px 1.5px 0.25px hsl(205 20% 90% / 0.03),
                inset 0 0 0.25px 0.5px hsl(205 20% 90% / 0.03);
        }
        .glass3d > * { position: relative; z-index: 6; }
 
        .panel {
            position: fixed;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 23px;
            color: white;
            overflow: visible;
            display:flex;
            flex-direction:column;
            justify-content:flex-end;
            align-items:center;
            transition: transform 0.4s ease, opacity 0.4s ease; ;
            padding-bottom: 40px;
        }

        .panel:hover {
            transform: scale(1.05);
        }

        .panel img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .intro-panel {
            position: fixed;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 15px;
            color: white;
            overflow: visible;
            transition: transform 0.4s ease, opacity 0.4s ease; 
        }
        
        .icon-btn {
            position: fixed;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 660px;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .icon-btn:hover {
            transform: scale(1.15);
        }

        .icon-btn img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .icon-btn-linkedin img {
            transform: scale(1.8);
        }

        
        .intro    { top: 340px; left: 235px; width: 200px; height: 300px; font-size: 16px; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .work     { top:  90px; left: 575px; width: 300px; height: 300px; }
        .projects { top: 425px; left: 575px; width: 300px; height: 300px; }
        .clubs    { top:  90px; left: 925px; width: 300px; height: 300px; }
        .contact  { top: 425px; left: 925px; width: 300px; height: 300px; }
 
        .github   { left: 263px; }
        .linkedin { left: 313px; }
        .resume   { left: 363px; }
 
        .profile-pic {
            top: 125px;
            left: 235px;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            position: fixed;
            z-index: 5;
            transition: transform 0.4s ease, opacity 0.4s ease; 
        }

        .fade { opacity: 0 !important; 
                pointer-events: none; }
    </style>
</head>
 
<body>
    <video id="bg" autoplay muted loop playsinline>
        <source src="media/backgroundVideo.mp4" type="video/mp4">
    </video>
 
    <button class="glass3d intro-panel intro"><span>Hi! I'm <b>Sharvari Deshpande</b>, a Computer Engineering student at Purdue's Honors College graduating May 2027. I'm interested in software development, and entrepreneurship.</span></button>
 
     <a href="pages/work.html">
        <button class="glass3d panel work">
            <img src="media/Work Experience.png" alt="icons">
            <span>Work Experience</span></button>
    </a>
    <a href="pages/projects.html" >
        <button class="glass3d panel projects">
            <img src="media/Projects.png" alt="icons">
            <span>Projects</span></button>
    </a>
    <a href="/pages/clubs.html">
        <button class="glass3d panel clubs">
            <img src="media/Clubs and Organizations.png" alt="icons">
            <span>Clubs & Organizations</span></button>
    </a>
    <a href="/pages/contact.html">
        <button class="glass3d panel contact">
            <img src="media/envelope-contactme.png" alt="mail">
            <span>Contact Me!</span>
        </button>
    </a>
 

    <a href="https://github.com/sharvari-deshp" target="_blank" rel="noopener" >
        <button class="glass3d icon-btn github">
            <img src="media/GitHub.png" alt="GitHub">
        </button>
    </a>
    <a href="https://www.linkedin.com/in/sharvarimdeshpande/" target="_blank" rel="noopener" >
        <button class="glass3d icon-btn icon-btn-linkedin linkedin">
            <img src="media/linkedin.png" alt="LinkedIn">
        </button>
    </a>
    <a href="resume/resume_sharvari_deshpande.pdf" target="_blank" rel="noopener" >
        <button class="glass3d icon-btn resume">
            <img src="media/Resume.png" alt="Resume">
        </button>
    </a>
 
    <img class="profile-pic" src="media/profilepicture.jpeg" alt="Profile Picture">


    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.href;
                document.querySelectorAll('.panel, .back-btn, .profile-pic, .github, .linkedin, .resume, .intro-panel').forEach(el => {
                    el.classList.add('fade');
                });
                setTimeout(() => { window.location.href = href; }, 400);
            });
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.querySelectorAll('.fade').forEach(el => el.classList.remove('fade'));
            }
        });
    </script>

</body>
</html>
