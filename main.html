<!DOCTYPE html>
<html>
<head>
    
    <style>
    body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden}
    video { position: fixed; width: 105%; height: 100%; object-fit: cover;}
    </style>

</head>

<body>

  <video autoplay muted loop playsinline>
    <source src="media/backgroundVideo.mp4" type="video/mp4">
  </video>

  <script>
  const video = document.getElementById('bg');
  video.play().catch(() => {
    document.addEventListener('click', () => video.play(), { once: true });
  });
</script>

</body>
</html>
