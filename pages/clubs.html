<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Outfit', sans-serif; }

        body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

        video { position: fixed; top: -1px; left: -1px; width: 105%; height: 105%; object-fit: cover; }

        .glass3d {
            --filter-glass3d: blur(26px) brightness(0.84) saturate(2);
            --color-glass3d: hsl(189 80% 22% / 0);
            position: relative;
            z-index: 4;
            box-shadow:
                0 0 0.75px hsl(205 20% 10% / 0.2),
                0.7px 0.8px 1.2px -0.4px hsl(205 20% 10% / 0.1),
                1.3px 1.5px 2.2px -0.8px hsl(205 20% 10% / 0.1),
                2.3px 2.6px 3.9px -1.2px hsl(205 20% 10% / 0.1),
                3.9px 4.4px 6.6px -1.7px hsl(205 20% 10% / 0.1),
                6.5px 7.2px 10.9px -2.1px hsl(205 20% 10% / 0.1),
                8px 9px 14px -2.5px hsl(205 20% 10% / 0.2);
        }
        .glass3d::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 3;
            -webkit-backdrop-filter: var(--filter-glass3d);
            backdrop-filter: var(--filter-glass3d);
            background-color: var(--color-glass3d);
            background-size: 100%, 100px;
            background-repeat: no-repeat, repeat;
        }
        .glass3d::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 5;
            box-shadow:
                inset 2px 2px 1px -3px hsla(175, 22%, 90%, 0.8),
                inset 4px 4px 2px -6px hsl(205 20% 90% / 0.3),
                inset 1.5px 1.5px 1.5px -0.75px hsl(205 20% 90% / 0.15),
                inset 1.5px 1.5px 0.25px hsl(205 20% 90% / 0.03),
                inset 0 0 0.25px 0.5px hsl(205 20% 90% / 0.03);
        }
        .glass3d > * { position: relative; z-index: 6; }
 
        .panel {
            position: fixed;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 15px;
            color: white;
            overflow: visible;
            transition: transform 0.2s ease;
        }

        .main { 
            top: 50px; 
            left: 475px; 
            width: 500px; 
            height: 675px; 
            font-size: 16px; 
            font-family: Verdana, Geneva, Tahoma, sans-serif; }


        .back-btn {
            position: fixed;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .back-btn:hover {
            transform: scale(1.15);
        }

        .back-btn img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .back   { left: 900px; top: 735px;}




    </style>
  </head>

  <body>
    <a href="../main.html" >
        <video id="bg" autoplay muted loop playsinline>
            <source src="../media/backgroundVideo.mp4" type="video/mp4">
        </video>
        </a>

    <button class="glass3d panel main"><span>sample text</span></button>
    
    <a href="../main.html" >
        <button class="glass3d back-btn back">
            <img src="../media/back.png" alt="Back">
        </button>
    </a>

  </body>
</html>
