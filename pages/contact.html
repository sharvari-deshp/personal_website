<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Outfit', sans-serif; }

        body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        video { position: fixed; top: -1px; left: -1px; width: 105%; height: 105%; object-fit: cover; }

        .glass3d {
            --filter-glass3d: blur(26px) brightness(0.84) saturate(2);
            --color-glass3d: hsl(189 80% 22% / 0);
            position: relative;
            z-index: 4;
            box-shadow:
                0 0 0.75px hsl(205 20% 10% / 0.2),
                0.7px 0.8px 1.2px -0.4px hsl(205 20% 10% / 0.1),
                1.3px 1.5px 2.2px -0.8px hsl(205 20% 10% / 0.1),
                2.3px 2.6px 3.9px -1.2px hsl(205 20% 10% / 0.1),
                3.9px 4.4px 6.6px -1.7px hsl(205 20% 10% / 0.1),
                6.5px 7.2px 10.9px -2.1px hsl(205 20% 10% / 0.1),
                8px 9px 14px -2.5px hsl(205 20% 10% / 0.2);
        }
        .glass3d::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 3;
            -webkit-backdrop-filter: var(--filter-glass3d);
            backdrop-filter: var(--filter-glass3d);
            background-color: var(--color-glass3d);
            background-size: 100%, 100px;
            background-repeat: no-repeat, repeat;
        }
        .glass3d::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 5;
            box-shadow:
                inset 2px 2px 1px -3px hsla(175, 22%, 90%, 0.8),
                inset 4px 4px 2px -6px hsl(205 20% 90% / 0.3),
                inset 1.5px 1.5px 1.5px -0.75px hsl(205 20% 90% / 0.15),
                inset 1.5px 1.5px 0.25px hsl(205 20% 90% / 0.03),
                inset 0 0 0.25px 0.5px hsl(205 20% 90% / 0.03);
        }
        .glass3d > * { position: relative; z-index: 6; }
 
        
        .panel {
            position: fixed;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 15px;
            color: white;
            overflow: visible;
            transition: transform 0.4s ease, opacity 0.4s ease; 
        }

        .main { 
            top: 50px; 
            left: 475px; 
            width: 500px; 
            height: 675px; 
            font-size: 16px; 
            font-family: Verdana, Geneva, Tahoma, sans-serif; }


        .back-btn {
            position: fixed;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .back-btn:hover {
            transform: scale(1.15);
        }

        .back-btn img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .back   { left: 900px; top: 735px;}

        .fade { 
            opacity: 0 !important; 
            pointer-events: none; }

        
        .submit-btn {
            position:absolute; 
            z-index:10; 
            top: 635px; 
            left: 670px; 
            padding:10px 32px; 
            border-radius:40px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            font-size:14px; 
            font-weight:600; 
            letter-spacing:1px; 
            overflow: visible;
            cursor:pointer;
            color:white !important;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .submit-btn > * {
            position:relative;
            z-index:10;
        }

        .submit-btn:hover {
            transform: scale(1.15);
        }


    </style>
  </head>

  <body>
    <a href="../main.html" >
        <video id="bg" autoplay muted loop playsinline>
            <source src="../media/backgroundVideo.mp4" type="video/mp4">
        </video>
        </a>
        

<button class="glass3d panel main"><span style="display:flex; flex-direction:column; height:100%;">

    <b style="font-size:30px; text-align:center; padding-top:3.5rem;">Contact Me</b>

    <span style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <form action="https://formspree.io/f/xgoqprnl" method="POST" style="display:flex; flex-direction:column; gap:80px;">
        <div style="display:flex; gap:25px; justify-content:center;">
            <div style="width:160px;">
                <label style="font-size:15px; color:rgba(255,255,255, 1);"><b>First Name</b></label>
                <input type="text" name="first_name" style="width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.4); color:white; padding:6px 0; outline:none; font-size:14px; box-sizing:border-box;text-align:center; gap: 20 px;">
            </div>
            <div style="width:160px;">
                <label style="font-size:15px; color:rgba(255,255,255, 1);"><b>Last Name</b></label>
                <input type="text" name="last_name" style="width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.4); color:white; padding:6px 0; outline:none; font-size:14px; box-sizing:border-box;text-align:center;">
            </div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center;">
            <div style="width:345px;">
                <label style="font-size:15px; color:rgba(255,255,255,1);"><b>Email</b> <span style="font-weight:normal;">(Required)</span></label>
                <input type="email" name="email" required style="width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.4); color:white; padding:6px 0; outline:none; font-size:14px; box-sizing:border-box;text-align:center;">
            </div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center;">
            <div style="width:345px;">
                <label style="font-size:15px; color:rgba(255,255,255,1);margin-top:-12px;"><b>Message</b> <span style="font-weight:normal;">(Required)</span></label>
                <textarea name="message" required style="width:100%; height:120px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.4); border-radius:12px; color:white; padding:20px; outline:none; font-size:14px; box-sizing:border-box; resize:none;text-align:center;margin-bottom:70px;margin-top:18px;"></textarea>
            </div>
        </div>

       <button type="submit" class="submit-btn">SUBMIT</button>
    <div id="success-message" style="display:none; position:absolute; z-index:9999; top:685px; left:635px; color:white; font-weight:400; transition: opacity 1.5s ease; opacity: 0;">✅ Thanks for reaching out! </div>
    </form>
    </span>

</span></button>

    
    
    <a href="../main.html" >
        <button class="glass3d back-btn back">
            <img src="../media/back.png" alt="Back">
        </button>
    </a>


<script>
    document.querySelector("form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const form = e.target;

        await fetch(form.action, {
            method: form.method,
            body: new FormData(form),
            headers: { "Accept": "application/json" }
        });

        const msg = document.getElementById("success-message");

        msg.style.display = "block";
        msg.style.opacity = "1";

        setTimeout(() => {
            msg.style.opacity = "0";
        }, 3000);
        form.reset();
    });

    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const href = this.href;
            document.querySelectorAll('.panel, .back-btn').forEach(el => {
                el.classList.add('fade');
            });
            setTimeout(() => { window.location.href = href; }, 400);
        });
    });
</script>

  </body>
</html>
